<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Safari Animal Adventure</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #e9dfc7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        /* ==========================
           A4 CANVA PAGE
        ========================== */

        .page {

            position: relative;

            width: min(92vw, 794px);

            aspect-ratio: 210 / 297;

            overflow: hidden;

            background: white;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.20);
        }


        /* ==========================
           YOUR CANVA DESIGN
        ========================== */

        .page img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: contain;
        }


        /* ==========================
           START BUTTON
        ========================== */

        .start-button {

            position: absolute;

            left: 20%;

            top: 82%;

            width: 60%;

            height: 8%;

            border: none;

            border-radius: 18px;

            background: #d69a45;

            color: white;

            font-size: clamp(16px, 2.8vw, 25px);

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 0 #a96d2c;

            transition: 0.15s;
        }


        .start-button:hover {

            transform: translateY(-3px);
        }


        .start-button:active {

            transform: translateY(3px);

            box-shadow:
                0 2px 0 #a96d2c;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .page {

                width: 96vw;
            }

            .start-button {

                border-radius: 14px;
            }
        }


        /* ==========================
           LANDSCAPE
        ========================== */

        @media (orientation: landscape)
               and (max-height: 600px) {

            .page {

                height: 94vh;

                width: auto;
            }
        }

    </style>

</head>


<body>


    <div class="page">

        <!-- YOUR COMPLETE CANVA DESIGN -->

        <img
            src="pages/title.png"
            alt="Title Page"
        >


        <!-- CLICKABLE START BUTTON -->

        <button
            class="start-button"
            onclick="window.location.href='index.html';"
        >

            Start Your Adventure

        </button>

    </div>


</body>

</html>

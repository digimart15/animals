<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #e9dfc7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        /* =========================
           A4 PAGE
        ========================= */

        .page {

            position: relative;

            width: min(92vw, 794px);

            aspect-ratio: 210 / 297;

            overflow: hidden;

            background: white;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.20);
        }


        /* =========================
           PNG
        ========================= */

        .page img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: contain;
        }


        /* =========================
           START BUTTON
        ========================= */

        .start-button {

            position: absolute;

            left: 20%;

            top: 82%;

            width: 60%;

            height: 8%;

            border: none;

            border-radius: 18px;

            background: #d69a45;

            color: white;

            font-size: clamp(16px, 2.8vw, 25px);

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 0 #a96d2c;
        }


        .start-button:hover {

            transform: translateY(-2px);

        }


        .start-button:active {

            transform: translateY(3px);

            box-shadow:
                0 2px 0 #a96d2c;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {

                width: 96vw;

            }

        }


        /* =========================
           LANDSCAPE
        ========================= */

        @media (orientation: landscape)
               and (max-height: 600px) {

            .page {

                height: 94vh;

                width: auto;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TITLE PAGE
    ========================= -->

    <div class="page">


        <!-- YOUR CANVA TITLE PNG -->

        <img
            src="pages/title.png"
            alt=""
        >


        <!-- START BUTTON -->

        <button
            class="start-button"
            onclick="startAdventure()"
        >

            Start Your Adventure

        </button>


    </div>


    <script>

        function startAdventure() {

            /*
             * This is where your animal activity
             * will start.
             *
             * For now, clicking the button simply
             * displays a message.
             *
             * When we add your 25 animals, this
             * function will change the screen to
             * Animal #1.
             */

            alert("Your adventure is about to begin!");

        }

    </script>


</body>

</html>

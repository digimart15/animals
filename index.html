<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Guess The Animal Adventure</title>


<style>

/* =====================================================
   BASIC PAGE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #e9dfc7;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: flex-start;

}


/* =====================================================
   GAME AREA
===================================================== */

#game {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* =====================================================
   A4 PAGE

   A4 PORTRAIT RATIO:
   210 : 297

   The page automatically scales to the screen.
===================================================== */

.a4-page {

    position: relative;

    width: min(90vw, 794px);

    aspect-ratio: 210 / 297;

    background: white;

    overflow: hidden;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.20);

}


/* =====================================================
   PNG IMAGE

   The entire Canva page is displayed.
===================================================== */

.a4-page img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

}


/* =====================================================
   TITLE PAGE
===================================================== */

.title-page {

    width: min(90vw, 794px);

    aspect-ratio: 210 / 297;

    background:
        linear-gradient(
            145deg,
            #fffaf0,
            #e9dfc7
        );

    box-shadow:
        0 5px 25px rgba(0,0,0,0.20);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 40px;

    position: relative;

    overflow: hidden;

}


.title-page::before {

    content: "🌿";

    position: absolute;

    top: 5%;

    left: 8%;

    font-size: clamp(45px, 8vw, 80px);

    opacity: 0.8;

}


.title-page::after {

    content: "🌴";

    position: absolute;

    right: 8%;

    bottom: 5%;

    font-size: clamp(45px, 8vw, 80px);

    opacity: 0.8;

}


.title-emoji {

    font-size: clamp(55px, 11vw, 110px);

    margin-bottom: 25px;

}


.title-heading {

    color: #6c8f4e;

    font-size: clamp(34px, 6vw, 62px);

    line-height: 1.15;

    font-weight: bold;

    margin-bottom: 20px;

}


.title-subtitle {

    color: #8b633d;

    font-size: clamp(20px, 3.5vw, 32px);

    line-height: 1.4;

    max-width: 600px;

}


.start-button {

    margin-top: 40px;

    padding: 17px 40px;

    border: none;

    border-radius: 15px;

    background: #d69a45;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #a96d2c;

}


.start-button:hover {

    transform: translateY(-2px);

}


.start-button:active {

    transform: translateY(3px);

    box-shadow: 0 2px 0 #a96d2c;

}


/* =====================================================
   CLICKABLE ANSWER AREAS

   These are invisible buttons placed over
   the answer choices in your Canva design.
===================================================== */

.answer-area {

    position: absolute;

    border: none;

    background: transparent;

    cursor: pointer;

    padding: 0;

}


/* Optional visual feedback when hovering */

.answer-area:hover {

    background: rgba(255,255,255,0.08);

}


/* =====================================================
   ENCOURAGEMENT PAGE
===================================================== */

.message-page {

    width: min(90vw, 794px);

    aspect-ratio: 210 / 297;

    background: #fffaf0;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.20);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 40px;

}


.message-emoji {

    font-size: clamp(55px, 10vw, 100px);

    margin-bottom: 20px;

}


.message-title {

    font-size: clamp(30px, 5vw, 50px);

    font-weight: bold;

    color: #6c8f4e;

    margin-bottom: 20px;

}


.message-text {

    font-size: clamp(20px, 3vw, 30px);

    line-height: 1.5;

    max-width: 600px;

}


.retry-button {

    margin-top: 35px;

    padding: 16px 35px;

    border: none;

    border-radius: 15px;

    background: #d69a45;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #a96d2c;

}


.retry-button:hover {

    transform: translateY(-2px);

}


.retry-button:active {

    transform: translateY(3px);

    box-shadow: 0 2px 0 #a96d2c;

}


/* =====================================================
   FINISH PAGE
===================================================== */

.finish-page {

    width: min(90vw, 794px);

    aspect-ratio: 210 / 297;

    background: #fffaf0;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.20);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 40px;

}


.finish-emoji {

    font-size: clamp(45px, 8vw, 80px);

    margin-bottom: 25px;

}


.finish-title {

    font-size: clamp(30px, 5vw, 50px);

    font-weight: bold;

    color: #6c8f4e;

    margin-bottom: 20px;

}


.finish-text {

    font-size: clamp(20px, 3vw, 30px);

    line-height: 1.5;

}


.play-again {

    margin-top: 35px;

    padding: 16px 35px;

    border: none;

    border-radius: 15px;

    background: #6c8f4e;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #4d6c37;

}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media (max-width: 600px) {

    #game {

        padding: 5px;

    }

    .a4-page,
    .title-page,
    .message-page,
    .finish-page {

        width: 96vw;

    }

}


/* =====================================================
   LANDSCAPE PHONES / TABLETS
===================================================== */

@media (orientation: landscape) and (max-height: 600px) {

    .a4-page,
    .title-page,
    .message-page,
    .finish-page {

        height: 94vh;

        width: auto;

    }

}

</style>

</head>


<body>

<script>

    },

        correct: "Polar Bear"
    }

];


/* ==========================================================
   CURRENT ANIMAL
========================================================== */

let currentAnimal = 0;


/* ==========================================================
   SHOW TITLE PAGE
========================================================== */

function showTitlePage() {

    const game = document.getElementById("game");


    game.innerHTML = `

        <div class="title-page">

            <div class="title-emoji">

                🦁 🐘 🦒

            </div>


            <div class="title-heading">

                Safari Animal Adventure

            </div>


            <div class="title-subtitle">

                Can you identify all 25 amazing animals?

                <br>

                Look closely at each silhouette and choose the correct answer!

            </div>


            <button

                class="start-button"

                onclick="showQuestion(0)"

            >

                Start Adventure

            </button>

        </div>

    `;

}


/* ==========================================================
   SHOW QUESTION PAGE
========================================================== */

function showQuestion(index) {

    currentAnimal = index;

    const animal = animals[index];

    const game = document.getElementById("game");


    /*
       ------------------------------------------------------
       IMPORTANT:

       The coordinates below control where the invisible
       clickable buttons are placed.

       They are percentages of the A4 page.

       You will probably need to adjust these TWO buttons
       to match the location of the answer choices in
       your Canva design.
       ------------------------------------------------------
    */


    game.innerHTML = `

        <div class="a4-page">

            <img
                src="${animal.question}"
                alt="Animal identification question"
            >


            <!-- ANSWER 1 -->

            <button

                class="answer-area"

                onclick="checkAnswer('${animal.answer1}')"

                aria-label="${animal.answer1}"

                style="
                    left: 10%;
                    top: 73%;
                    width: 80%;
                    height: 8%;
                "

            ></button>


            <!-- ANSWER 2 -->

            <button

                class="answer-area"

                onclick="checkAnswer('${animal.answer2}')"

                aria-label="${animal.answer2}"

                style="
                    left: 10%;
                    top: 82%;
                    width: 80%;
                    height: 8%;
                "

            ></button>

        </div>

    `;

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(answer) {

    const animal = animals[currentAnimal];


    if (answer === animal.correct) {

        showReveal();

    }

    else {

        showEncouragement();

    }

}


/* ==========================================================
   SHOW REVEAL PAGE
========================================================== */

function showReveal() {

    const animal = animals[currentAnimal];

    const game = document.getElementById("game");


    let nextAction = "";


    if (currentAnimal < animals.length - 1) {

        nextAction = `

            <button

                class="answer-area"

                onclick="showQuestion(${currentAnimal + 1})"

                aria-label="Next animal"

                style="
                    left: 20%;
                    top: 88%;
                    width: 60%;
                    height: 7%;
                "

            ></button>

        `;

    }

    else {

        nextAction = `

            <button

                class="answer-area"

                onclick="finishGame()"

                aria-label="Finish adventure"

                style="
                    left: 20%;
                    top: 88%;
                    width: 60%;
                    height: 7%;
                "

            ></button>

        `;

    }


    game.innerHTML = `

        <div class="a4-page">

            <img

                src="${animal.reveal}"

                alt="${animal.name} revealed"

            >

            ${nextAction}

        </div>

    `;

}


/* ==========================================================
   WRONG ANSWER PAGE
========================================================== */

function showEncouragement() {

    const game = document.getElementById("game");


    game.innerHTML = `

        <div class="message-page">

            <div class="message-emoji">
                🌟
            </div>


            <div class="message-title">
                Almost There!
            </div>


            <div class="message-text">

                Great try! 💛

                <br><br>

                Take another look at the silhouette.

                <br>

                You can do it!

            </div>


            <button

                class="retry-button"

                onclick="showQuestion(${currentAnimal})"

            >

                ← Try Again

            </button>

        </div>

    `;

}


/* ==========================================================
   FINISH PAGE
========================================================== */

function finishGame() {

    const game = document.getElementById("game");


    game.innerHTML = `

        <div class="finish-page">

            <div class="finish-emoji">

                🦁 🐘 🦒 🦓

            </div>


            <div class="finish-title">

                🎉 Safari Adventure Complete! 🎉

            </div>


            <div class="finish-text">

                Amazing work! 🌟

                <br><br>

                You identified all 25 animals!

                <br><br>

                You are officially a

                <strong>
                    Safari Animal Expert!
                </strong>

                🏆

            </div>


            <button

                class="play-again"

                onclick="showTitlePage()"

            >

                🔄 Play Again

            </button>

        </div>

    `;

}


/* ==========================================================
   START WITH TITLE PAGE
========================================================== */

showTitlePage();
